# ~/.codex/config.toml для ноутбука.
# Имена ключей проверить на репетиции: запусти `codex` и убедись, что конфиг принят без предупреждений.
# model намеренно не задан: Codex берёт лучшую модель тарифа сам (на Pro это gpt-5.6/gpt-6 линейка).
# Задать вручную только если /model в Codex показывает что-то слабее, чем gpt-6-sol.
model_reasoning_effort = "medium"
approval_policy = "on-failure"
sandbox_mode = "workspace-write"

# pnpm install и vercel требуют сеть: без этой строки workspace-write её режет.
[sandbox_workspace_write]
network_access = true

[profiles.agent]
model_reasoning_effort = "high"

# Запуск в день: `codex --full-auto` (правки и команды в рабочей папке без вопросов, песочница остаётся).
# Полный обход `codex --dangerously-bypass-approvals-and-sandbox` только если песочница Windows блокирует pnpm или сеть.
# Страховка при любом режиме: коммит после каждого блока, .env* никогда не печатать и не коммитить.
